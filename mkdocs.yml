site_name: Processo de Avaliação de Produto de Software
site_description: Documentação do projeto da disciplina de Qualidade de Software
theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
  palette:
    primary: custom
    accent: amber
extra_css:
  - stylesheets/extra.css
nav:
  - Visão Geral: index.md
  - "Fase 1":
      - Propósito da avaliação: fase1-requisitos.md
      - Produto Avaliado: fase1/produto-avaliado.md
      - Modelo de Qualidade de Produto: fase1/modelo-qualidade.md
      - Alinhamento aos Objetivos de Desenvolvimento Sustentável (ODS): fase1/alinhamento-ods.md
  - "Fase 2":
      - Especificação da avaliação: fase2-especificacao.md
      - Objetivos de medição: fase2/objetivos.md
      - Questões e hipóteses: fase2/questoes-hipoteses.md
      - Métricas e pontuações: fase2/metricas.md
      - Gráfico GQM: fase2/grafico-gqm.md
      - Critérios de julgamento: fase2/criterios-julgamento.md
      - Rastreabilidade Fase 1–2: fase2/rastreabilidade.md
      - Protocolo de coleta: fase2/protocolo-coleta.md
      - Gestão PSM/CID: fase2/gestao-psm.md
  - "Fase 3": fase3-projeto.md
  - "Fase 4": fase4-execucao.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  
