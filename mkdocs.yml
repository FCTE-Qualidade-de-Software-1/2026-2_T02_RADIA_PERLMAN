site_name: Processo de Avaliação de Produto de Software
site_description: Documentação do projeto da disciplina de Qualidade de Software
repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_RADIA_PERLMAN
repo_name: Equipe Radia Perlman (GitHub)
copyright: "Equipe Radia Perlman — Qualidade de Software 2026.2 | Última atualização: 21/11/2026"

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
  palette:
    primary: custom
    accent: amber

extra_css:
  - stylesheets/extra.css

nav:
  - Visão Geral: index.md
  - "Fase 1":
      - Propósito da avaliação: fase1-requisitos.md
      - Produto Avaliado: fase1/produto-avaliado.md
      - Modelo de Qualidade de Produto: fase1/modelo-qualidade.md
      - Alinhamento aos Objetivos de Desenvolvimento Sustentável (ODS): fase1/alinhamento-ods.md
  - "Fase 2":
      - Especificação da avaliação: fase2-especificacao.md
      - Objetivos de medição: fase2/objetivos.md
      - Questões e hipóteses: fase2/questoes-hipoteses.md
      - Métricas e pontuações: fase2/metricas.md
      - Gráfico GQM: fase2/grafico-gqm.md
      - Critérios de julgamento: fase2/criterios-julgamento.md
      - Rastreabilidade Fase 1–2: fase2/rastreabilidade.md
      - Protocolo de coleta: fase2/protocolo-coleta.md
      - Gestão PSM/CID: fase2/gestao-psm.md
      - "Resultados PSM/CID":
          - "Visão geral": fase2/psm/index.md
          - "Entrega 1": fase2/psm/entrega_1/relatorio.md
          - "Entrega 2": fase2/psm/entrega_2/relatorio.md
          - "Consolidado": fase2/psm/consolidado/relatorio.md
  - "Fase 3":
      - Plano de Avaliação: fase3-plano-avaliacao.md
      - Recursos e ambiente: fase3/recursos-ambiente.md
      - Método e procedimentos: fase3/metodo-procedimentos.md
      - Cronograma de execução: fase3/cronograma.md
  - "Fase 4":
      - Visão geral da execução: fase4-execucao.md
      - Obtenção das medidas: fase4/obtencao-medidas.md
      - Dados brutos e evidências: fase4/dados-brutos.md
      - "Resultados GQM":
          - "G1 — Usabilidade": fase4/resultados-g1-usabilidade.md
          - "G2 — Confiabilidade": fase4/resultados-g2-confiabilidade.md
          - "G3 — Segurança": fase4/resultados-g3-seguranca.md
          - "G4 — Eficiência de desempenho": fase4/resultados-g4-desempenho.md
      - Julgamento e conclusões: fase4/julgamento-conclusoes.md
      - Ação de melhoria: fase4/acao-melhoria.md
  - "IA Generativa": ia-generativa.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format