
name: Coletar metricas PSM

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write
  issues: read

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas
        run: python -m pip install matplotlib

      - name: Calcular metricas das duas entregas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSM_MILESTONES: 'Entrega 1 — Fases 1 e 2;Entrega 2 — Fases 3 e 4'
        run: python scripts/coletar_metricas_psm.py

      - name: Publicar relatorio da execucao
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-psm
          path: relatorios/psm/
          if-no-files-found: warn

      - name: Solicitar atualizacao do GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=atualizar-psm
