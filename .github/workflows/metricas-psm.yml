name: Coletar metricas PSM

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read
  issues: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calcular metricas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSM_MILESTONE: 'Entrega 1 — Fases 1 e 2'
        run: python scripts/coletar_metricas_psm.py
      - name: Publicar relatorio da execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-psm
          path: relatorios/psm/
          if-no-files-found: warn
