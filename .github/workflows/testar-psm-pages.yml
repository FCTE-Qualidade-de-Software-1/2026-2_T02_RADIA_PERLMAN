
name: Testar integracao PSM e MkDocs

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material==9.6.23 matplotlib

      - name: Coletar metricas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSM_MILESTONES: 'Entrega 1 — Fases 1 e 2;Entrega 2 — Fases 3 e 4'
        run: python scripts/coletar_metricas_psm.py

      - name: Preparar relatorios
        run: python scripts/publicar_psm_docs.py

      - name: Validar MkDocs
        run: python -m mkdocs build --strict

      - name: Salvar site para verificacao
        uses: actions/upload-artifact@v4
        with:
          name: site-mkdocs-teste
          path: site/
