
name: Publicar documentação MkDocs

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - atualizar-psm

permissions:
  contents: write
  issues: read

concurrency:
  group: deploy-mkdocs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material==9.6.23 matplotlib

      - name: Coletar métricas PSM/CID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSM_MILESTONES: 'Entrega 1 — Fases 1 e 2;Entrega 2 — Fases 3 e 4'
        run: python scripts/coletar_metricas_psm.py

      - name: Preparar relatórios para MkDocs
        run: python scripts/publicar_psm_docs.py

      - name: Validar documentação
        run: python -m mkdocs build

      - name: Publicar documentação
        run: python -m mkdocs gh-deploy --force
